<div class="min-h-full bg-muted-bg pb-12">
  <!-- Header -->
  <header class="border-b border-card-border bg-white">
    <div class="mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-6 lg:px-8">
      <h1 class="flex items-center gap-2.5 text-lg font-semibold tracking-tight text-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="#3B82F6">
          <path d="M12 2l10 18H2L12 2z" />
        </svg>
        <span>Metrics Dashboard</span>
      </h1>

      <div class="flex flex-wrap items-center gap-3">
        <app-filters-panel
          [filters]="filters"
          (filtersChange)="filtersChange.emit($event)"
          (reset)="resetFilters.emit()"
        ></app-filters-panel>

        <button type="button" (click)="onSignalrToggle()">
          <app-live-badge [active]="signalrConnected" activeLabel="Live" inactiveLabel="Connect live updates"></app-live-badge>
        </button>
      </div>
    </div>
  </header>

  <div class="mx-auto max-w-7xl space-y-6 px-4 py-6 sm:px-6 lg:px-8">
    <!-- Error banner -->
    <div
      *ngIf="error"
      class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-danger animate-fade-in"
    >
      {{ error }}
    </div>

    <!-- KPI cards -->
    <app-metrics-cards-grid [metrics]="kpiMetrics" [history]="kpiHistory" [loading]="loading"></app-metrics-cards-grid>

    <!-- Charts -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-line-chart
        [title]="filters.category + ' overview'"
        subtitle="Average values across all metrics"
        [chartLabel]="filters.category + ' Trend'"
        [metrics]="metrics"
        [unit]="metrics[0]?.unit ?? ''"
        [loading]="loading"
      ></app-line-chart>

      <app-bar-chart
        [title]="filters.category + ' Comparison'"
        subtitle="Resource usage comparison (latest)"
        [metrics]="metrics"
        [loading]="loading"
      ></app-bar-chart>
    </div>

    <!-- Table -->
    <div>
      <h2 class="text-lg font-semibold tracking-tight text-foreground">All readings</h2>
      <p class="mb-3 text-sm text-muted">Raw metric readings over time</p>
      <app-metrics-table [metrics]="metrics" [loading]="loading"></app-metrics-table>
    </div>
  </div>
</div>
