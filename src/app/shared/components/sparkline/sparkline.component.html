<svg
  *ngIf="points"
  [attr.viewBox]="'0 0 ' + width + ' ' + height"
  [style.height.px]="height"
  class="w-full"
  preserveAspectRatio="none"
>
  <polyline
    [attr.points]="points"
    fill="none"
    [attr.stroke]="color"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
