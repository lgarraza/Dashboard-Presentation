<span
  class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium transition"
  [ngClass]="active ? 'bg-success/10 text-success' : 'bg-gray-100 text-muted'"
>
  <span
    class="h-2 w-2 rounded-full"
    [ngClass]="active ? 'bg-success animate-pulse-dot' : 'bg-gray-400'"
  ></span>
  {{ active ? activeLabel : inactiveLabel }}
</span>
