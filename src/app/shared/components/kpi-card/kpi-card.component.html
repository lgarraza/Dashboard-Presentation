<div
  class="rounded-xl border border-card-border bg-white p-6 transition duration-150 hover:border-gray-300 animate-fade-in"
>
  <ng-container *ngIf="!loading; else skeleton">
    <div class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg" [class]="iconColorClasses">
        <svg
          *ngIf="icon === 'cpu'"
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="7" y="7" width="10" height="10" rx="1.5" />
          <path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3" />
        </svg>
        <svg
          *ngIf="icon === 'memory'"
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="6" width="18" height="12" rx="1.5" />
          <path d="M7 6v12M11 6v12M15 6v12" />
        </svg>
        <svg
          *ngIf="icon === 'clock'"
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 3" />
        </svg>
        <svg
          *ngIf="icon === 'globe'"
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3c2.5 2.6 3.8 5.8 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.8-3.8-9s1.3-6.4 3.8-9z" />
        </svg>
      </span>
      <span class="text-sm font-medium text-muted">{{ label }}</span>
    </div>

    <div class="mt-4 flex items-baseline gap-1">
      <span *ngIf="metric; else noValue" class="text-3xl font-bold tabular-nums tracking-tight text-foreground">
        {{ displayValue | number: '1.0-1' }}
      </span>
      <ng-template #noValue>
        <span class="text-3xl font-bold text-gray-300">&mdash;</span>
      </ng-template>
      <span *ngIf="metric" class="text-sm font-medium text-muted">{{ metric.unit }}</span>
    </div>

    <div class="mt-1.5 flex items-center gap-1 text-sm font-medium" [class]="trendColorClass">
      <ng-container *ngIf="trend !== 'flat'">
        <span>{{ trend === 'up' ? '↑' : '↓' }}</span>
        <span *ngIf="trendPercent !== null">{{ trendPercent! > 0 ? '+' : '' }}{{ trendPercent! | number: '1.0-1' }}%</span>
        <span class="font-normal text-muted">vs 24h ago</span>
      </ng-container>
      <span *ngIf="trend === 'flat'" class="text-muted">No change vs 24h ago</span>
    </div>

    <div class="mt-3">
      <app-sparkline [data]="sparklineData" [color]="sparklineColor" [height]="36"></app-sparkline>
    </div>
  </ng-container>

  <ng-template #skeleton>
    <div class="animate-pulse">
      <div class="h-8 w-8 rounded-lg bg-gray-200"></div>
      <div class="mt-4 h-8 w-24 rounded bg-gray-200"></div>
      <div class="mt-2 h-4 w-32 rounded bg-gray-100"></div>
    </div>
  </ng-template>
</div>
