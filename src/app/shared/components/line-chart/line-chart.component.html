<div class="rounded-xl border border-card-border bg-white p-6 animate-fade-in">
  <div class="flex items-center gap-1.5">
    <h3 class="text-base font-semibold tracking-tight text-foreground">{{ title }}</h3>
    <span
      *ngIf="subtitle"
      class="cursor-default text-xs text-gray-300"
      [title]="subtitle"
    >
      ⓘ
    </span>
  </div>
  <p *ngIf="subtitle" class="text-sm text-muted">{{ subtitle }}</p>

  <div class="mt-4 h-64">
    <div *ngIf="loading" class="h-full w-full animate-pulse rounded-lg bg-gray-100"></div>

    <ng-container *ngIf="!loading">
      <canvas
        *ngIf="metrics.length > 1; else notEnoughData"
        baseChart
        [data]="data"
        [options]="options"
        type="line"
      ></canvas>
      <ng-template #notEnoughData>
        <div class="flex h-full items-center justify-center text-sm text-muted">Not enough data yet</div>
      </ng-template>
    </ng-container>
  </div>
</div>
